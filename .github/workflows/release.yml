name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

# Publishing uses npm Trusted Publishing (OIDC): there is no NPM_TOKEN secret.
# BEFORE THE FIRST AUTOMATED RELEASE, link this repository and workflow on npmjs.com:
#   package settings → Trusted Publisher → GitHub Actions,
#   repository "inktrap/inktrap", workflow file "release.yml".
# A brand-new package name can't have a trusted publisher yet, so the very first version
# may need to be published manually (or with a temporary token) before linking it.
permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open the "Version Packages" PR
  id-token: write # mint the OIDC token npm uses for trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # Node 24 ships npm >= 11.5.1, required for trusted publishing.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
