name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

# Publishing uses npm Trusted Publishing (OIDC): there is no NPM_TOKEN secret.
# @inktrapjs/react trusts this repository with workflow file "release.yml" and no
# environment; renaming this file breaks publishing until npmjs.com is updated.
# A new package must be published by hand once before it can trust this workflow
# (see "Adding a package" in RELEASING.md).
permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open the "Version Packages" PR
  id-token: write # mint the OIDC token npm uses for trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Node 24 ships npm >= 11.5.1, required for trusted publishing.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
