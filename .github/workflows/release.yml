name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

# Publishing uses npm Trusted Publishing (OIDC): there is no NPM_TOKEN secret.
# BEFORE THE FIRST AUTOMATED RELEASE, link this repository and workflow on npmjs.com:
#   @inktrapjs/react → Settings → Trusted Publisher → GitHub Actions,
#   owner "TanguiLouedec", repository "inktrap", workflow file "release.yml".
# A package that doesn't exist on npm yet can't have a trusted publisher, so 0.1.0 is
# published by hand first. See RELEASING.md for the full first-release steps.
#
# Also enable: repo Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests", or changesets/action can't open the "Version Packages" PR.
permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open the "Version Packages" PR
  id-token: write # mint the OIDC token npm uses for trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # Node 24 ships npm >= 11.5.1, required for trusted publishing.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
